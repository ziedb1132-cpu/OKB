name: OKB AI 100-cycle runner
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: okb-paper-engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore split state if present
        run: python state_storage.py restore
      - name: Validate code and feature schema
        run: |
          python -m compileall -q ai_model.py feature_engine.py news_engine.py run_cycle.py signal_manager.py okb_engine.py state_storage.py strategy_engine.py
          python - <<'PY'
          import math
          from feature_engine import build_features
          from ai_model import gate_status
          from strategy_engine import evaluate_strategies
          candles=[]
          for i in range(300):
              p=100+i*0.02
              candles.append({"ts":i,"o":p-0.01,"h":p+0.05,"l":p-0.05,"c":p,"vol":1000+i})
          features=build_features(candles,{"trend":0.01,"volatility":0.002},{"imbalance":0.1,"spread_pct":0.02},0.05)
          assert len(features)==1205, f"Expected 1205 features, got {len(features)}"
          assert len(evaluate_strategies(candles))==8, "Expected 8 strategy families"
          sample={k:0.001 for k in features}
          closed=[{"status":"TP","features":sample,"feature_version":"okb-1200-v2"} for _ in range(10)]
          assert not gate_status(closed[:9])["enabled"], "AI gate opened before 10 closes"
          assert gate_status(closed)["enabled"], "AI gate did not open at 10 compatible closes"
          invalid=dict(sample);invalid[next(iter(invalid))]=float("nan")
          bad=[{"status":"TP","features":invalid,"feature_version":"okb-1200-v2"} for _ in range(10)]
          assert not gate_status(bad)["enabled"], "AI gate accepted non-finite features"
          wrong=[{"status":"TP","features":sample,"feature_version":"wrong-version"} for _ in range(10)]
          assert not gate_status(wrong)["enabled"], "AI gate accepted an incompatible feature version"
          print("PREFLIGHT_OK features=1205 strategies=8 ai_gate=10 finite/version_checked")
          PY
      - name: Execute 100 cycles and persist every cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          for i in $(seq 1 100); do
            python run_cycle.py
            python state_storage.py pack
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Persist OKB cycle $i [skip ci]" || true
            pushed=0
            for attempt in $(seq 1 8); do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "PERSIST_REBASE_FAILED cycle=$i attempt=$attempt"
                git rebase --abort || true
                break
              fi
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              case "$attempt" in
                1) delay=2 ;;
                2) delay=4 ;;
                3) delay=8 ;;
                4) delay=16 ;;
                5) delay=32 ;;
                *) delay=60 ;;
              esac
              echo "PERSIST_RETRY cycle=$i attempt=$attempt/8 wait=${delay}s"
              sleep "$delay"
            done
            if [ "$pushed" -ne 1 ]; then
              echo "PERSIST_PUSH_FAILED cycle=$i"
              exit 1
            fi
            sleep 60
          done
          gh workflow run okb-cycle.yml --repo "$GH_REPOSITORY" --ref main
      - name: Upload recovery state if cycle or persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: okb-recovery-state-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            okb_state.json
            okb_summary.json
            strategy_history.json
            okb_model.pt
            okb_exit_policy.pt
            okb_state.json.parts/**
            okb_state.json.parts.json
            okb_summary.json.parts/**
            okb_summary.json.parts.json
            strategy_history.json.parts/**
            strategy_history.json.parts.json
            okb_model.pt.parts/**
            okb_model.pt.parts.json
            okb_exit_policy.pt.parts/**
            okb_exit_policy.pt.parts.json
